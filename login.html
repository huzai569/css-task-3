
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - The Daily Times</title>
    <link rel="stylesheet" href="./login.css">
</head>
<body>

    <div class="login-container">

        <header class="login-header">
            <a href="./index.html" class="login-back">← Back to Home</a>
            <h1>The Daily Times</h1>
            <p id="your-news">YOUR NEWS. YOUR WORLD.</p>
        </header>

        <main class="login-box">

            <h2 >Welcome Back</h2>
            <p class="login-description">
                Log in to access your account and enjoy your news.
            </p>

            <form action="#" method="get">

                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

                <div class="login-options">
                    <label class="remember">
                        <input type="checkbox" name="remember">
                        Remember me
                    </label>

                    <a href="#">Forgot Password?</a>
                </div>

                <button type="submit" class="login-button">
                    LOG IN
                </button>

            </form>

            <p class="signup-text">
                Don't have an account?
                <a href="subscribe.html">Subscribe Now</a>
            </p>

            <a href="index.html" class="login-home">
                Return to Homepage
            </a>

        </main>

        <footer class="login-footer">
            © 2026 Copy Right Reversed A to Z Solutions
        </footer>

    </div>

</body>
</html>
